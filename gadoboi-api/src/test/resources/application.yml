spring:
  datasource:
    url: jdbc:h2:mem:gadoboi_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true

security:
  jwt:
    secret: test-secret-key-must-be-at-least-32-chars
    expiration-ms: 86400000
